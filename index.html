<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TAJWAY — Discover Tajikistan</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#f4f7f8;
  color:#172027
}

#map{
  position:fixed;
  inset:0;
  z-index:1
}

/* SEARCH */
.topbar{
  position:fixed;
  top:10px;
  left:6px;
  right:6px;
  z-index:1000
}

.searchbox{
  width:100%;
  height:58px;
  background:#fff;
  border-radius:30px;
  box-shadow:0 5px 24px #0002;
  display:flex;
  align-items:center;
  padding:6px 7px 6px 17px
}

.logo{
  font-size:23px;
  font-weight:900;
  color:#168447;
  margin-right:12px;
  white-space:nowrap
}

#searchInput{
  flex:1;
  min-width:0;
  width:0;
  border:0;
  outline:0;
  background:transparent;
  font-size:17px;
  color:#172027
}

#searchBtn{
  width:46px;
  height:46px;
  border:0;
  border-radius:16px;
  background:#168447;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center
}

/* SVG */
.svgIcon{
  width:22px;
  height:22px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round
}

.searchIcon{
  width:22px;
  height:22px
}

/* MAP BUTTONS */
.mapButtons{
  position:fixed;
  right:12px;
  top:80px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:8px
}

.mapBtn{
  width:48px;
  height:48px;
  border:0;
  border-radius:16px;
  background:#fff;
  box-shadow:0 4px 18px #0003;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#172027
}

.mapBtn.green{
  background:#168447;
  color:#fff
}

.mapBtn:active{
  transform:scale(.94)
}

/* TRANSPORT */
.transportPanel{
  position:fixed;
  z-index:1500;
  left:10px;
  right:10px;
  top:80px;
  max-height:78vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  box-shadow:0 12px 40px #0003;
  padding:15px;
  display:none
}

.transportPanel.show{
  display:block
}

.transportHeader{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.transportTitle{
  font-size:21px;
  font-weight:900
}

.closeBtn{
  width:40px;
  height:40px;
  border:0;
  border-radius:13px;
  background:#eef0f1;
  font-size:24px
}

.transportSubtitle{
  font-size:14px;
  color:#777;
  margin:3px 0 12px
}

.modeTabs{
  display:flex;
  gap:7px;
  margin-bottom:10px
}

.modeTab{
  flex:1;
  border:0;
  border-radius:13px;
  padding:10px 5px;
  background:#edf2f3;
  font-weight:800;
  font-size:14px
}

.modeTab.active{
  background:#168447;
  color:#fff
}

.inputBox{
  height:54px;
  border:2px solid #e0e2e3;
  border-radius:16px;
  display:flex;
  align-items:center;
  padding:0 13px;
  margin-bottom:7px
}

.inputBox input{
  width:100%;
  border:0;
  outline:0;
  font-size:16px
}

.swapBtn{
  width:100%;
  height:40px;
  border:0;
  border-radius:13px;
  background:#edf3f5;
  color:#237f4e;
  font-weight:800;
  margin-bottom:7px
}

.findBtn{
  width:100%;
  height:52px;
  border:0;
  border-radius:16px;
  background:#168447;
  color:#fff;
  font-size:15px;
  font-weight:900
}

.resultArea{
  margin-top:10px
}

.loading,.hint,.noResult,.resultCard{
  border-radius:15px;
  padding:12px;
  font-size:14px;
  line-height:1.45
}

.loading{
  background:#f1f4f5;
  color:#687177;
  text-align:center
}

.hint{
  background:#f2f6f7;
  color:#687177;
  margin-top:9px
}

.noResult{
  background:#fff0f0;
  color:#8d4646
}

.resultCard{
  background:#f4f7f8;
  margin-bottom:8px
}

.resultCard.best{
  background:#e8f7ed;
  border:1px solid #b9e3c7
}

.routeName{
  font-size:17px;
  font-weight:900;
  margin-bottom:7px
}

.routeNumber{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:42px;
  height:30px;
  border-radius:10px;
  background:#168447;
  color:#fff;
  margin-right:5px;
  font-size:15px
}

.routeInfo{
  color:#50595e
}

.routeStops{
  border-top:1px solid #dce3e0;
  margin-top:8px;
  padding-top:8px;
  color:#4d5559
}

.showRouteBtn{
  width:100%;
  height:41px;
  border:0;
  border-radius:13px;
  background:#168447;
  color:#fff;
  font-weight:800;
  margin-top:9px
}

/* BOTTOM SHEET */
.bottomSheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:52vh;
  z-index:900;
  background:#fff;
  border-radius:27px 27px 0 0;
  box-shadow:0 -5px 28px #0002;
  transition:height .22s ease,transform .22s ease;
  padding:0 14px
}

.bottomSheet.collapsed{
  height:52px
}

.sheetHandle{
  height:52px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer
}

.sheetHandle span{
  display:block;
  width:45px;
  height:5px;
  background:#d5dadd;
  border-radius:10px
}

.sheetScroll{
  height:calc(100% - 52px);
  overflow-y:auto;
  padding:0 4px 25px
}

.bottomSheet.collapsed .sheetScroll{
  display:none
}

.bottomSheet.dragging{
  transition:none
}

.bottomSheet.collapsed .sheetHandle span{
  width:37px
}

.intro{
  font-size:16px;
  color:#697177;
  line-height:1.35;
  margin:2px 2px 12px
}

/* CATEGORIES */
.categoryGrid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px
}

.category{
  position:relative;
  overflow:hidden;
  min-height:92px;
  border:0;
  border-radius:18px;
  background:#f1f5f7;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 4px;
  font-weight:800;
  color:#202a30;
  font-size:11px
}

/* НОВЫЕ ИЗОБРАЖЕНИЯ КАТЕГОРИЙ */
.categoryImage{
  position:absolute;
  top:6px;
  right:6px;
  width:30px;
  height:30px;
  border-radius:9px;
  object-fit:cover;
  box-shadow:0 3px 9px #0003;
  border:2px solid rgba(255,255,255,.9);
  z-index:1
}

.categoryIcon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#168447;
  position:relative;
  z-index:2
}

.categoryIcon svg{
  width:27px;
  height:27px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round
}

.category.marsh{
  background:#e3f5ea;
  color:#147d42
}

.category.marsh .categoryIcon{
  color:#147d42;
  font-size:27px
}

.category:active{
  transform:scale(.97)
}

/* CITIES */
.cities{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:12px 2px
}

.city{
  border:0;
  border-radius:13px;
  background:#f1f5f7;
  padding:10px 14px;
  font-weight:800;
  white-space:nowrap
}

/* LANGUAGES */
.languagePanel{
  position:fixed;
  z-index:1600;
  right:12px;
  top:80px;
  width:190px;
  background:#fff;
  border-radius:17px;
  box-shadow:0 8px 30px #0003;
  padding:7px;
  display:none
}

.languagePanel.show{
  display:block
}

.lang{
  width:100%;
  border:0;
  background:#fff;
  text-align:left;
  padding:10px;
  border-radius:10px
}

@media(max-width:430px){
  .categoryGrid{
    grid-template-columns:repeat(3,minmax(0,1fr))
  }

  .logo{
    font-size:21px
  }

  #searchInput{
    font-size:16px
  }

  .bottomSheet{
    height:56vh
  }

  .category{
    min-height:88px
  }

  .categoryImage{
    width:28px;
    height:28px;
    top:5px;
    right:5px
  }
}
</style>
</head>

<body>

<div id="map"></div>

<!-- SEARCH -->
<div class="topbar">
  <div class="searchbox">

    <div class="logo" data-i18n="appName">
      TAJWAY
    </div>

    <input
      id="searchInput"
      type="search"
      placeholder="Найти место в Таджикистане"
      data-i18n-placeholder="searchPlaceholder"
    >

    <button id="searchBtn" aria-label="Поиск">
      <svg class="searchIcon svgIcon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-4-4"></path>
      </svg>
    </button>

  </div>
</div>

<!-- MAP BUTTONS -->
<div class="mapButtons">

  <!-- LOCATION -->
  <button
    class="mapBtn"
    onclick="locateUser()"
    aria-label="Моё местоположение"
  >
    <svg class="svgIcon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7"></circle>
      <circle cx="12" cy="12" r="2"></circle>
      <path d="M12 2v3"></path>
      <path d="M12 19v3"></path>
      <path d="M2 12h3"></path>
      <path d="M19 12h3"></path>
    </svg>
  </button>

  <!-- TRANSPORT -->
  <button
    class="mapBtn green"
    onclick="openTransport()"
    aria-label="Маршрутки"
  >🚐</button>

  <!-- LANGUAGE -->
  <button
    class="mapBtn"
    onclick="toggleLanguage()"
    aria-label="Язык"
  >
    <svg class="svgIcon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M3 12h18"></path>
      <path d="M12 3c3 3 3 15 0 18"></path>
      <path d="M12 3c-3 3-3 15 0 18"></path>
    </svg>
  </button>

</div>

<!-- LANGUAGE PANEL -->
<div id="languagePanel" class="languagePanel">

  <button class="lang" data-lang="tg">
    Тоҷикӣ
  </button>

  <button class="lang" data-lang="ru">
    Русский
  </button>

  <button class="lang" data-lang="en">
    English
  </button>

  <button class="lang" data-lang="zh">
    中文
  </button>

  <button class="lang" data-lang="es">
    Español
  </button>

  <button class="lang" data-lang="fr">
    Français
  </button>

  <button class="lang" data-lang="de">
    Deutsch
  </button>

  <button class="lang" data-lang="ar">
    العربية
  </button>

  <button class="lang" data-lang="tr">
    Türkçe
  </button>

</div>

<!-- TRANSPORT -->
<div id="transportPanel" class="transportPanel">

  <div class="transportHeader">

    <div
      class="transportTitle"
      data-i18n="transportTitle"
    >
      🚐 Найти маршрутку
    </div>

    <button
      class="closeBtn"
      onclick="closeTransport()"
    >
      ×
    </button>

  </div>

  <div
    class="transportSubtitle"
    data-i18n="transportSubtitle"
  >
    Ищет не только Корвон и Гипрозем — можно вводить любое место.
  </div>

  <div class="modeTabs">

    <button
      id="marshTab"
      class="modeTab active"
      onclick="setMode('marsh')"
      data-i18n="marshTab"
    >
      🚐 Маршрутки
    </button>

    <button
      id="carTab"
      class="modeTab"
      onclick="setMode('car')"
      data-i18n="carTab"
    >
      <svg
        class="svgIcon"
        style="display:inline-block;vertical-align:middle;width:18px;height:18px"
        viewBox="0 0 24 24"
      >
        <path d="M5 17h14"></path>
        <path d="M6 17l1-6h10l1 6"></path>
        <path d="M8 11 9.5 7h5L16 11"></path>
        <circle cx="7" cy="17" r="1.5"></circle>
        <circle cx="17" cy="17" r="1.5"></circle>
      </svg>
      Авто
    </button>

  </div>

  <div class="inputBox">
    <input
      id="fromInput"
      placeholder="Откуда: Саховат, Корвон, Худжанд..."
      data-i18n-placeholder="fromPlaceholder"
    >
  </div>

  <button
    class="swapBtn"
    onclick="swapPlaces()"
    data-i18n="swapBtn"
  >
    ⇅ Поменять местами
  </button>

  <div class="inputBox">
    <input
      id="toInput"
      placeholder="Куда: Гипрозем, Мехргон, Сино..."
      data-i18n-placeholder="toPlaceholder"
    >
  </div>

  <button
    class="findBtn"
    onclick="findTransport()"
    data-i18n="findBtn"
  >
    НАЙТИ МАРШРУТ
  </button>

  <div id="resultArea"></div>

  <div class="hint" data-i18n="hint">
    <b>Можно писать как угодно:</b>
    КОРВОН, корвон, Рынок Корвон, ГИПРОЗЕМГОРОДОК,
    Саховат рынок, Мехргон и другие названия.
  </div>

</div>

<!-- BOTTOM SHEET -->
<div id="bottomSheet" class="bottomSheet">

  <div id="sheetHandle" class="sheetHandle">
    <span></span>
  </div>

  <div id="sheetScroll" class="sheetScroll">

    <div class="intro" data-i18n="intro">
      Найдите нужное место или выберите категорию.
    </div>

    <div class="categoryGrid">

      <!-- ДОСТОПРИМЕЧАТЕЛЬНОСТИ -->
      <button
        class="category"
        onclick="showTourism('all')"
        data-i18n="catSights"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="m3 19 7-10 4 5 2-3 5 8"></path>
            <path d="M3 19h18"></path>
          </svg>
        </span>

        Достопримечательности

      </button>

      <!-- РЕСТОРАН -->
      <button
        class="category"
        onclick="loadOSM('restaurant')"
        data-i18n="catRestaurants"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="M7 3v8"></path>
            <path d="M4 3v5a3 3 0 0 0 6 0V3"></path>
            <path d="M7 11v10"></path>
            <path d="M16 3v18"></path>
            <path d="M16 3c4 1 4 7 0 8"></path>
          </svg>
        </span>

        Рестораны

      </button>

      <!-- ОТЕЛЬ -->
      <button
        class="category"
        onclick="loadOSM('hotel')"
        data-i18n="catHotels"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="M4 20V5h16v15"></path>
            <path d="M4 14h16"></path>
            <path d="M7 10h3"></path>
            <path d="M14 10h3"></path>
            <path d="M7 17h3"></path>
            <path d="M14 17h3"></path>
          </svg>
        </span>

        Отели

      </button>

      <!-- МАГАЗИН -->
      <button
        class="category"
        onclick="loadOSM('shop')"
        data-i18n="catShops"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="M4 10h16v10H4z"></path>
            <path d="M3 10 5 4h14l2 6"></path>
            <path d="M8 14h8"></path>
          </svg>
        </span>

        Магазины

      </button>

      <!-- АПТЕКА -->
      <button
        class="category"
        onclick="loadOSM('pharmacy')"
        data-i18n="catPharmacies"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1585435557343-3b092031a831?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
            <rect
              x="4"
              y="4"
              width="16"
              height="16"
              rx="3"
            ></rect>
          </svg>
        </span>

        Аптеки

      </button>

      <!-- АЗС -->
      <button
        class="category"
        onclick="loadOSM('fuel')"
        data-i18n="catFuel"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="M5 21V4h10v17"></path>
            <path d="M5 4h10v6H5z"></path>
            <path d="M15 8h3l2 3v7"></path>
            <path d="M20 18h-2"></path>
          </svg>
        </span>

        АЗС

      </button>

      <!-- БОЛЬНИЦА -->
      <button
        class="category"
        onclick="loadOSM('hospital')"
        data-i18n="catHospitals"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="M5 21V5h14v16"></path>
            <path d="M9 9h6"></path>
            <path d="M12 6v6"></path>
            <path d="M3 21h18"></path>
          </svg>
        </span>

        Больницы

      </button>

      <!-- МАРШРУТКИ -->
      <button
        class="category marsh"
        onclick="openTransport()"
        data-i18n="catMarsh"
      >

        <!-- 🚐 СОХРАНЁН -->
        <span class="categoryIcon">
          🚐
        </span>

        Маршрутки

      </button>

      <!-- ГОРЫ -->
      <button
        class="category"
        onclick="showTourism('mountains')"
        data-i18n="catMountains"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="m3 20 7-12 4 7 2-4 5 9"></path>
            <path d="M10 8 12 5l2 3"></path>
          </svg>
        </span>

        Горы

      </button>

      <!-- ОЗЁРА -->
      <button
        class="category"
        onclick="showTourism('lakes')"
        data-i18n="catLakes"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="M3 15c3-3 6 3 9 0s6 3 9 0"></path>
            <path d="M3 19c3-3 6 3 9 0s6 3 9 0"></path>
            <path d="M7 9c2-3 4-3 6 0"></path>
          </svg>
        </span>

        Озёра

      </button>

      <!-- ИСТОРИЯ -->
      <button
        class="category"
        onclick="showTourism('historical')"
        data-i18n="catHistory"
      >

        <img
          class="categoryImage"
          src="https://images.unsplash.com/photo-1568322445389-f64ac2515020?auto=format&fit=crop&w=200&q=80"
          alt=""
        >

        <span class="categoryIcon">
          <svg viewBox="0 0 24 24">
            <path d="M4 20h16"></path>
            <path d="M5 20V10h14v10"></path>
            <path d="M3 10h18"></path>
            <path d="m12 4 9 6H3z"></path>
            <path d="M8 13v4"></path>
            <path d="M12 13v4"></path>
            <path d="M16 13v4"></path>
          </svg>
        </span>

        История

      </button>

      <!-- ПРИРОДА -->
      <button
        class="category"
        onclick="showTourism('nature')"
        data-i18n="catNature"
      >

function norm(s){
  return String(s||"")
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/[«»"'.,!?;:()[\]{}]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function compact(s){
  return norm(s).replace(/[\s-]/g,"")
}

function canonical(q){

  const n=norm(q);

  for(const k in ALIASES){

    for(const a of ALIASES[k]){

      const aa=norm(a);

      if(
        n===aa ||
        compact(n)===compact(aa) ||
        n.includes(aa) ||
        aa.includes(n)
      ){
        return k;
      }
    }
  }

  return n;
}

function placeMatch(q,name){

  const a=canonical(q);
  const b=canonical(name);

  if(a===b)return true;

  const nq=norm(q);
  const nn=norm(name);

  return nq===nn ||
    compact(nq)===compact(nn) ||
    nn.includes(nq) ||
    nq.includes(nn);
}

/* ПОИСК ПО ТАДЖИКИСТАНУ */

async function geocode(q){

  const u=
    "https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=tj&accept-language=ru&q="+
    encodeURIComponent(q+", Tajikistan");

  const r=await fetch(u,{
    headers:{
      "Accept-Language":"ru"
    }
  });

  const d=await r.json();

  return d.map(x=>({
    lat:+x.lat,
    lon:+x.lon,
    name:x.display_name
  }));
}

async function geocodeOne(q){
  const d=await geocode(q);
  return d[0]||null;
}

/* ТОЛЬКО ТАДЖИКИСТАН НА КАРТЕ */

async function loadTJ(){

  try{

    const u=
      "https://nominatim.openstreetmap.org/search?format=json&polygon_geojson=1&limit=1&countrycodes=tj&q=Tajikistan";

    const r=await fetch(u,{
      headers:{
        "Accept-Language":"ru"
      }
    });

    const d=await r.json();

    if(!d[0])return;

    const g=d[0].geojson;

    borderLayer=L.geoJSON(g,{
      style:{
        color:"#168447",
        weight:3,
        fill:false
      }
    }).addTo(map);

    let holes=[];

    if(g.type==="Polygon"){
      holes=[
        g.coordinates[0].map(c=>[c[1],c[0]])
      ];
    }

    if(g.type==="MultiPolygon"){
      g.coordinates.forEach(p=>{
        if(p[0]){
          holes.push(
            p[0].map(c=>[c[1],c[0]])
          );
        }
      });
    }

    if(holes.length){

      const world=[
        [-89.9,-179.9],
        [-89.9,179.9],
        [89.9,179.9],
        [89.9,-179.9]
      ];

      maskLayer=L.polygon(
        [world,...holes],
        {
          stroke:false,
          fillColor:"#f4f7f8",
          fillOpacity:.94,
          interactive:false
        }
      ).addTo(map);

      maskLayer.bringToBack();
      borderLayer.bringToFront();
    }

  }catch(e){
    console.log("TJ boundary:",e);
  }
}

/* МАРШРУТЫ */

const MARSH_REFS=new Set([
  "1","2","3","4","5","6","7","8","10","11","14",
  "15","16","17","19","25","28","33","42","46",
  "52","54","56","58","81","88","108","279"
]);

async function nearbyRouteRelations(p){

  const q=`[out:json][timeout:25];(
    node(around:2500,${p.lat},${p.lon})["highway"="bus_stop"];
    node(around:2500,${p.lat},${p.lon})["public_transport"="platform"];
    node(around:2500,${p.lat},${p.lon})["public_transport"="stop_position"];
  );rel(bn)["type"="route"];out tags qt;`;

  const r=await fetch(
    "https://overpass-api.de/api/interpreter",
    {
      method:"POST",
      body:q
    }
  );

  const d=await r.json();

  return d.elements.filter(x=>{

    const ref=String(x.tags?.ref||"").trim();
    const name=norm(x.tags?.name||"");
    const rt=norm(x.tags?.route||"");

    return MARSH_REFS.has(ref) ||
      name.includes("маршрут") ||
      rt==="minibus" ||
      rt==="share taxi";
  });
}

function routeKey(r){
  return String(
    r.tags?.ref ||
    r.tags?.name ||
    r.id
  ).toLowerCase().trim();
}

function routeLabel(r){
  return r.tags?.ref
    ? "№"+r.tags.ref
    : (r.tags?.name||"Маршрут");
}

function routeType(r){

  const t=norm(r.tags?.route||"");

  return (
    t==="share taxi" ||
    t==="minibus" ||
    MARSH_REFS.has(
      String(r.tags?.ref||"")
    )
  )
  ? "Маршрутка"
  : "Общественный транспорт";
}

async function dynamicRoutes(a,b){

  const [ra,rb]=await Promise.all([
    nearbyRouteRelations(a),
    nearbyRouteRelations(b)
  ]);

  const bm=new Map(
    rb.map(x=>[routeKey(x),x])
  );

  const common=[];

  ra.forEach(x=>{
    const y=bm.get(routeKey(x));
    if(y)common.push(x);
  });

  return common;
}

function isKhujand(a,b){

  const x=norm(
    (a?.name||"")+" "+
    (b?.name||"")
  );

  return x.includes("худжанд") ||
    x.includes("khujand") ||
    x.includes("хучанд");
}

function fallbackDirect(from,to){

  const pool=
    window.__routeCity==="khujand"
      ? KHUJAND_FALLBACK
      : FALLBACK;

  const out=[];

  for(const r of pool){

    let i=-1;
    let j=-1;

    r.stops.forEach((st,k)=>{

      if(i<0 && placeMatch(from,st))
        i=k;

      if(j<0 && placeMatch(to,st))
        j=k;

    });

    if(i>=0 && j>=0 && i!==j)
      out.push({r,i,j});
  }

  return out;
}

/* OSM ROUTE */

async function showOSMRoute(id,a,b){

  routeLayer.clearLayers();

  const q=
    `[out:json][timeout:20];relation(${id});way(r);out geom qt;`;

  try{

    const d=await(
      await fetch(
        "https://overpass-api.de/api/interpreter",
        {
          method:"POST",
          body:q
        }
      )
    ).json();

    const lines=[];

    d.elements
      .filter(x=>x.type==="way"&&x.geometry)
      .forEach(w=>{
        lines.push(
          w.geometry.map(p=>[p.lat,p.lon])
        );
      });

    lines.forEach(line=>{
      L.polyline(
        line,
        {
          color:"#168447",
          weight:5,
          opacity:.8
        }
      ).addTo(routeLayer);
    });

  }catch(e){}

  addEndpointMarkers(a,b);
}

function addEndpointMarkers(a,b){

  const icon=L.divIcon({
    className:"",
    html:
      "<div style='width:18px;height:18px;border-radius:50%;background:#168447;border:3px solid white;box-shadow:0 2px 8px #0005'></div>",
    iconSize:[18,18],
    iconAnchor:[9,9]
  });

  L.marker([a.lat,a.lon],{icon})
    .bindPopup("Откуда")
    .addTo(routeLayer);

  L.marker([b.lat,b.lon],{icon})
    .bindPopup("Куда")
    .addTo(routeLayer);

  map.fitBounds(
    [
      [a.lat,a.lon],
      [b.lat,b.lon]
    ],
    {
      padding:[80,80]
    }
  );
}

/* ПОИСК МАРШРУТКИ */

async function searchMarsh(from,to){

  const result=document.getElementById("resultArea");

  result.innerHTML=
    "<div class='loading'>Ищу маршрутки рядом с обеими точками…</div>";

  try{

    const [a,b]=await Promise.all([
      geocodeOne(from),
      geocodeOne(to)
    ]);

    if(!a||!b){

      result.innerHTML=
        "<div class='noResult'><b>Не удалось найти одну из точек.</b><br>Добавь город/район/улицу, например: «Саховат, Душанбе».</div>";

      return;
    }

    window.__routeCity=
      isKhujand(a,b)
        ? "khujand"
        : "dushanbe";

    const [dynamic,fb]=await Promise.all([
      dynamicRoutes(a,b).catch(()=>[]),
      Promise.resolve(
        fallbackDirect(from,to)
      )
    ]);

    let html="";
    const seen=new Set();

    if(fb.length){

      html+=
        "<div class='resultCard best'>"+
        "<div class='routeName'>Найдено прямых маршруток: "+fb.length+"</div>"+
        "<div class='routeInfo'>Обе точки находятся на остановках/участках одной линии.</div>"+
        "</div>";

      fb.forEach(x=>{

        if(seen.has(x.r.ref))return;

        seen.add(x.r.ref);

        const lo=Math.min(x.i,x.j);
        const hi=Math.max(x.i,x.j);

        html+=
          `<div class="resultCard">

            <div class="routeName">
              <span class="routeNumber">№${x.r.ref}</span>
              Маршрутка
            </div>

            <div class="routeInfo">
              <b>${x.r.title}</b><br>
              🕐 ${x.r.time}<br>
              🔄 ${x.r.interval}<br>
              💰 ${x.r.fare}
            </div>

            <div class="routeStops">
              <b>Ваш участок:</b><br>
              ${x.r.stops.slice(lo,hi+1).join(" → ")}
            </div>

            <button
              class="showRouteBtn"
              onclick='showFallback(${JSON.stringify(x.r)},${JSON.stringify(a)},${JSON.stringify(b)})'
            >
              ПОКАЗАТЬ НА КАРТЕ
            </button>

          </div>`;
      });
    }

    if(dynamic.length){

      const fresh=
        dynamic.filter(
          r=>!seen.has(
            String(r.tags?.ref||"")
          )
        );

      if(fresh.length){

        html+=
          "<div class='resultCard best'>"+
          "<div class='routeName'>Также найдены линии на карте</div>"+
          "<div class='routeInfo'>Остановки и маршрутные линии получены из OpenStreetMap.</div>"+
          "</div>";
      }

      fresh.slice(0,10).forEach(r=>{

        seen.add(
          String(
            r.tags?.ref||r.id
          )
        );

        html+=
          `<div class="resultCard">

            <div class="routeName">
              <span class="routeNumber">${routeLabel(r)}</span>
              ${routeType(r)}
            </div>

            <div class="routeInfo">
              <b>${r.tags?.name||"Маршрут"}</b>
              ${r.tags?.operator
                ? "<br>Перевозчик: "+r.tags.operator
                : ""}
            </div>

            <button
              class="showRouteBtn"
              onclick="showOSMRoute(${r.id},${JSON.stringify(a)},${JSON.stringify(b)})"
            >
              ПОКАЗАТЬ НА КАРТЕ
            </button>

          </div>`;
      });
    }

    if(!html){

      html=
        `<div class="noResult">

          <b>Прямой маршрут не найден.</b><br><br>

          Но база TAJWAY содержит маршруты Душанбе и отдельную базу Худжанда.

          Для Душанбе загружены ключевые номера:

          ${ROUTE_DIRECTORY.join(", ")}.

          <br><br>

          Попробуй ближайшую остановку или добавь «Душанбе» к названию.

        </div>`;
    }

    result.innerHTML=html;

  }catch(e){

    result.innerHTML=
      "<div class='noResult'><b>Сервис маршрутов временно не ответил.</b><br>Повтори поиск через несколько секунд.</div>";
  }
}

function showFallback(r,a,b){

  routeLayer.clearLayers();

  addEndpointMarkers(a,b);

  closeTransport();
}

async function carRoute(from,to){

  const result=document.getElementById("resultArea");

  result.innerHTML=
    "<div class='loading'>Строю автомобильный маршрут…</div>";

  const [a,b]=await Promise.all([
    geocodeOne(from),
    geocodeOne(to)
  ]);

  if(!a||!b){

    result.innerHTML=
      "<div class='noResult'>Не удалось найти одну из точек в Таджикистане.</div>";

    return;
  }

  try{

    const u=
      `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`;

    const d=await(
      await fetch(u)
    ).json();

    if(!d.routes?.length)
      throw Error();

    routeLayer.clearLayers();

    const line=
      d.routes[0]
        .geometry
        .coordinates
        .map(c=>[c[1],c[0]]);

    const l=L.polyline(
      line,
      {
        color:"#168447",
        weight:6
      }
    ).addTo(routeLayer);

    map.fitBounds(
      l.getBounds(),
      {
        padding:[70,70]
      }
    );

    result.innerHTML=
      `<div class="resultCard best">

        <div class="routeName">
          Автомаршрут
        </div>

        <div class="routeInfo">

          <b>${from}</b> → <b>${to}</b>

          <br><br>

          📏 ${(d.routes[0].distance/1000).toFixed(1)} км

          <br>

          🕐 ~${Math.round(d.routes[0].duration/60)} мин

        </div>

      </div>`;

  }catch(e){

    result.innerHTML=
      "<div class='noResult'>Автомаршрут не удалось построить.</div>";
  }
}

function findTransport(){

  const from=
    document.getElementById("fromInput").value.trim();

  const to=
    document.getElementById("toInput").value.trim();

  if(!from||!to){

    document.getElementById("resultArea").innerHTML=
      "<div class='noResult'><b>Введите откуда и куда.</b></div>";

    return;
  }

  transportMode==="marsh"
    ? searchMarsh(from,to)
    : carRoute(from,to);
}

/* ГЛОБАЛЬНЫЙ ПОИСК */

async function searchPlace(){

  const q=
    document
      .getElementById("searchInput")
      .value
      .trim();

  if(!q)return;

  markers.clearLayers();

  try{

    const d=await geocode(q);

    if(!d.length){

      alert(
        "Место в Таджикистане не найдено."
      );

      return;
    }

    d.forEach(p=>{

      L.marker(
        [p.lat,p.lon]
      )
      .bindPopup(
        "<b>"+p.name+"</b>"
      )
      .addTo(markers);
    });

    if(d.length === 1){

      map.setView(
        [d[0].lat,d[0].lon],
        15
      );

    }else{

      const bounds =
        d.map(p=>[p.lat,p.lon]);

      map.fitBounds(
        bounds,
        {
          padding:[80,80]
        }
      );
    }

  }catch(e){

    alert(
      "Не удалось выполнить поиск."
    );
  }
}

document
  .getElementById("searchBtn")
  .onclick=searchPlace;

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    e=>{
      if(e.key==="Enter")

    }
  );

/* МОЁ МЕСТОПОЛОЖЕНИЕ */

function showUserPosition(position){

  const lat=position.coords.latitude;
  const lon=position.coords.longitude;
  const accuracy=position.coords.accuracy||0;

  if(
    lat<36.5 ||
    lat>41.2 ||
    lon<67 ||
    lon>75.4
  ){

    alert(
      "Ваше местоположение находится за пределами Таджикистана."
    );

    return;
  }

  if(userMarker){
    map.removeLayer(userMarker);
  }

  if(userAccuracy){
    map.removeLayer(userAccuracy);
  }

  userAccuracy=L.circle(
    [lat,lon],
    {
      radius:accuracy,
      color:"#168447",
      weight:1,
      fillColor:"#168447",
      fillOpacity:.12
    }
  ).addTo(map);

  userMarker=L.circleMarker(
    [lat,lon],
    {
      radius:9,
      color:"#fff",
      weight:4,
      fillColor:"#168447",
      fillOpacity:1
    }
  )
  .addTo(map)
  .bindPopup(
    "Вы здесь<br>Точность: "+
    Math.round(accuracy)+" м"
  );

  map.setView(
    [lat,lon],
    16
  );

  userMarker.openPopup();
}

function stopLocationWatch(){

  if(locationWatch!==null){

    navigator.geolocation.clearWatch(
      locationWatch
    );

    locationWatch=null;
  }

  if(locationTimer){

    clearTimeout(locationTimer);
    locationTimer=null;
  }
}

function locateUser(){

  if(!navigator.geolocation){

    alert(
      "Ваш браузер или WebView не поддерживает геолокацию."
    );

    return;
  }

  stopLocationWatch();

  let bestAccuracy=Infinity;
  let started=Date.now();

  locationWatch=
    navigator.geolocation.watchPosition(

      position=>{

        const accuracy=
          position.coords.accuracy||999999;

        if(accuracy<bestAccuracy){

          bestAccuracy=accuracy;

          showUserPosition(position);
        }

        if(
          accuracy<=60 ||
          Date.now()-started>18000
        ){

          stopLocationWatch();
        }
      },

      error=>{

        if(error.code===1){

          stopLocationWatch();

          alert(
            "Доступ к геолокации запрещён.\n\n"+
            "Разрешите доступ к местоположению для TAJWAY в настройках телефона."
          );

        }else if(
          error.code===2 ||
          error.code===3
        ){

        }
      },

      {
        enableHighAccuracy:true,
        maximumAge:0,
        timeout:20000
      }
    );

  locationTimer=setTimeout(()=>{

    if(locationWatch!==null){

      stopLocationWatch();

      if(bestAccuracy===Infinity){

        navigator.geolocation.getCurrentPosition(

          position=>{
            showUserPosition(position);
          },

          ()=>{

            alert(
              "Не удалось получить местоположение.\n\n"+
              "Включите GPS/Местоположение на телефоне и попробуйте ещё раз."
            );

          },

          {
            enableHighAccuracy:false,
            maximumAge:0,
            timeout:15000
          }
        );
      }
    }

  },20000);
}

/* КАТЕГОРИИ */

async function loadOSM(type){

  markers.clearLayers();

  let q;

  if(type==="circus"){

    q=
      `[out:json][timeout:30];
      (
        nwr(36.5,67,41.2,75.4)["amenity"="theatre"]["theatre:type"="circus"];
        nwr(36.5,67,41.2,75.4)["name"~"цирк|circus|sirk",i];
      );
      out center 150;`;

  }else if(type==="park"){

    q=
      `[out:json][timeout:30];
      (
        nwr(36.5,67,41.2,75.4)["leisure"="park"];
      );
      out center 150;`;

  }else{

    const tags={

      restaurant:
        '["amenity"="restaurant"]',

      hotel:
        '["tourism"="hotel"]',

      shop:
        '["shop"]',

      pharmacy:
        '["amenity"="pharmacy"]',

      fuel:
        '["amenity"="fuel"]',

      hospital:
        '["amenity"="hospital"]'
    };

    q=
      `[out:json][timeout:25];
      (
        nwr${tags[type]}(36.5,67,41.2,75.4);
      );
      out center 150;`;
  }

  try{

    const d=await(
      await fetch(
        "https://overpass-api.de/api/interpreter",
        {
          method:"POST",
          body:q
        }
      )
    ).json();

    const b=[];

    d.elements.forEach(x=>{

      const lat=
        x.lat ??
        x.center?.lat;

      const lon=
        x.lon ??
        x.center?.lon;

      if(
        lat==null ||
        lon==null
      )return;

      const name=
        x.tags?.name ||
        (
          type==="circus"
            ? "Цирк"
            : type==="park"
              ? "Парк"
              : "Место"
        );

      L.marker(
        [lat,lon]
      )
      .bindPopup(
        "<b>"+
        name+
        "</b>"
      )
      .addTo(markers);

      b.push(
        [lat,lon]
      );
    });

    if(
      !b.length &&
      type==="circus"
    ){

      const circus=
        await geocode(
          "Государственный цирк Таджикистана Душанбе"
        );

      circus.forEach(p=>{

        L.marker(
          [p.lat,p.lon]
        )
        .bindPopup(
          "<b>Государственный цирк Таджикистана</b>"
        )
        .addTo(markers);

        b.push(
          [p.lat,p.lon]
        );
      });
    }

    if(b.length){

      map.fitBounds(
        b,
        {
          padding:[60,60]
        }
      );

    }else{

      alert(
        type==="circus"
          ? "Цирк в базе карт не найден."
          : "Ничего не найдено."
      );
    }

  }catch(e){

    alert(
      "Не удалось загрузить места."
    );
  }
}

const supportedLangs=[
  "ru",

let currentLang=
  localStorage.getItem("tajway_lang")||"ru";

function applyLanguage(lang){

  const t=
    translations[lang]||
    translations["en"];

  document
    .querySelectorAll("[data-i18n]")
    .forEach(el=>{

      const key=
        el.dataset.i18n;

      if(t[key]!==undefined){

        el.innerHTML=
          t[key];
      }
    });

  document
    .querySelectorAll("[data-i18n-placeholder]")
    .forEach(el=>{

      const key=
        el.dataset.i18nPlaceholder;

      if(t[key]!==undefined){

        el.placeholder=
          t[key];
      }
    });

  localStorage.setItem(
    "tajway_lang",
    lang
  );

  currentLang=lang;

  document
    .getElementById("languagePanel")
    .classList.remove("show");
}

document
  .querySelectorAll(".lang")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      function(){

        const lang=
          this.dataset.lang;

        if(
          lang &&
          translations[lang]
        ){

          applyLanguage(lang);

        }else{

          applyLanguage("en");
        }
      }
    );
  });

document.addEventListener(
  "DOMContentLoaded",
  function(){

    applyLanguage(
      currentLang
    );

  }
);

function toggleLanguage(){

  document
    .getElementById("languagePanel")
    .classList.toggle("show");
}

/* BOTTOM SHEET */

const sheet=
  document.getElementById(
    "bottomSheet"
  );

const scroll=
  document.getElementById(
    "sheetScroll"
  );

const handle=
  document.getElementById(
    "sheetHandle"
  );

let touchStartY=0;
let touchStartX=0;
let touchMoved=false;

function setSheetCollapsed(v){

  sheet.classList.toggle(
    "collapsed",
    !!v
  );

  setTimeout(()=>{

    map.invalidateSize({
      pan:false
    });

  },230);
}

handle.addEventListener(
  "click",
  ()=>{

    setSheetCollapsed(
      !sheet.classList.contains(
        "collapsed"
      )
    );

  }
);

sheet.addEventListener(
  "touchstart",
  e=>{

    if(!e.touches[0])return;

    touchStartY=
      e.touches[0].clientY;

    touchStartX=
      e.touches[0].clientX;

    touchMoved=false;

    sheet.classList.add(
      "dragging"
    );

  },
  {
    passive:true
  }
);

sheet.addEventListener(
  "touchmove",
  e=>{

    if(!e.touches[0])return;

    const dy=
      e.touches[0].clientY-
      touchStartY;

    const dx=
      e.touches[0].clientX-
      touchStartX;

    if(
      Math.abs(dy)>12 &&
      Math.abs(dy)>Math.abs(dx)
    ){

      touchMoved=true;
    }

  },
  {
    passive:true
  }
);

sheet.addEventListener(
  "touchend",
  e=>{

    sheet.classList.remove(
      "dragging"
    );

    if(!touchMoved)return;

    const dy=
      e.changedTouches[0].clientY-
      touchStartY;

    if(dy>45){

      setSheetCollapsed(true);

    }else if(dy<-45){

      setSheetCollapsed(false);
    }

  },
  {
    passive:true
  }
);

scroll.addEventListener(
  "scroll",
  ()=>{

    if(
      sheet.classList.contains(
        "collapsed"
      )
    )return;

  }
);
